.stage-chip { font-family: var(--display); font-size: .9rem; color: var(--pink); margin: 0 0 6px; letter-spacing: .02em; }
.rules-card { background: var(--pink-soft); border-radius: 12px; padding: 8px 14px; margin: 6px 0 12px; font-size: .95rem; }
.rules-card ul { margin: 2px 0 0; padding-left: 20px; }
.rules-card li { margin: 1px 0; }
.cer-steps { display: flex; gap: 6px; margin: 0 0 8px; }
.cer-steps span { border: 2px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 700; color: var(--ink-soft); }
.cer-steps span.on { border-color: var(--pink); background: var(--pink); color: var(--paper); }
.plan-card h4 { font-family: var(--display); margin: 14px 0 4px; }
.plan-list { list-style: none; padding: 0; margin: 0; }
.plan-list li { padding: 6px 10px 6px 34px; margin: 4px 0; border-radius: 10px; background: var(--mint-soft); position: relative; }
.plan-list li::before { content: "✓"; position: absolute; left: 12px; color: var(--mint); font-weight: 700; }
.rec-verdict { border-radius: 12px; padding: 12px 16px; margin: 12px 0; text-align: left; }
.rec-verdict.good { background: var(--mint-soft); border-left: 6px solid var(--mint); }
.rec-verdict.weak { background: var(--warn-soft); border-left: 6px solid var(--amber); }
.remember.z-cal { background: var(--sky-soft); } .remember.z-cal .brief-label, .explain .brief-label { color: var(--sky); }
.remember.z-arc { background: var(--violet-soft); } .remember.z-arc .brief-label { color: var(--violet); }
.stage { display: flex; gap: 8px; margin: 0; }
.stage span { border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .88rem; color: var(--ink-soft); }
.stage span.on { border-color: var(--sky); color: var(--ink); font-weight: 700; }

/* zones */
.zone.z-cal .zonebar h2 { color: var(--sky); } .zone.z-arc .zonebar h2 { color: var(--violet); }
.zone.z-cal .work-panel { border-color: var(--sky); } .zone.z-arc .work-panel { border-color: var(--violet); }
.explain { background: var(--sky-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.archive-card { background: var(--violet-soft); border-radius: 18px; padding: 26px 28px; border: 2px solid var(--violet); }
.archive-card h3 { color: var(--violet); font-size: 1.5rem; }
.archive-card p:last-child { font-size: 1.2rem; margin: 8px 0 0; }
.streak { font-weight: 700; color: var(--sky); margin: 0; }

/* svg visuals */
.viz { width: 100%; height: auto; display: block; font-family: var(--body); }
.plot-target { cursor: crosshair; touch-action: none; }
.viz .g-major { stroke: var(--grid-1); stroke-width: 1.2; }
.viz .g-minor { stroke: var(--grid-2); stroke-width: 1; }
.viz .g-decade { stroke: var(--grid-3); stroke-width: 1.8; }
.viz .frame { fill: none; stroke: var(--ink); stroke-width: 2; }
.viz .tick { fill: var(--ink); font-size: 14px; }
.viz .v-title { fill: var(--ink); font-family: var(--display); font-weight: 600; font-size: 19px; }
.viz .ax-title { fill: var(--ink); font-weight: 700; font-size: 15px; }
.viz .legend { fill: var(--ink); font-size: 13px; }
.viz .bar { fill: var(--pink); }
.viz .boundary { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.viz .r-solid { fill: var(--r-solid); } .viz .r-liquid { fill: var(--r-liquid); } .viz .r-gas { fill: var(--r-gas); }
.viz .region-label { fill: var(--ink); font-family: var(--display); font-size: 22px; font-weight: 600; paint-order: stroke; stroke: var(--plot); stroke-width: 4px; }
.viz .pt-dot { fill: var(--ink); }
.viz .pt-label, .viz .hl-label { fill: var(--ink); font-size: 13px; font-weight: 700; paint-order: stroke; stroke: var(--plot); stroke-width: 4px; }
.viz .hl-label { font-size: 15px; }
.viz .hl-ring { fill: none; stroke: var(--ink); stroke-width: 3; }
.viz .hl-dot { fill: var(--ink); }
.viz .arrow { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 8 5; }
.viz .pending line { stroke: var(--pink); stroke-width: 1.5; stroke-dasharray: 4 4; }
.viz .pending circle { fill: none; stroke: var(--pink); stroke-width: 3; }
.viz .ghost { fill: none; stroke: var(--mint); stroke-width: 3; stroke-dasharray: 5 4; }
.draw-in { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 1.2s ease-out .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.stamp { position: absolute; font-family: var(--display); font-weight: 600; font-size: 2.2rem; color: var(--pink); border: 5px solid var(--pink); border-radius: 12px; padding: 2px 18px; transform: rotate(-12deg); opacity: .9; animation: stamp .45s cubic-bezier(.2, 1.6, .5, 1) .9s both; background: var(--stamp-bg); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .9; } }

/* tables */
.table-wrap { overflow-x: auto; }
.datatable { border-collapse: collapse; width: 100%; font-size: 1rem; }
.datatable caption { font-family: var(--display); font-weight: 600; font-size: 1.1rem; text-align: left; padding: 4px 4px 10px; }
.datatable th, .datatable td { border: 2px solid var(--line); padding: 9px 12px; text-align: center; }
.datatable thead th { background: var(--violet-soft); font-size: .95rem; }
.datatable tbody th { font-weight: 700; }
.datatable tr.row-now td, .datatable tr.row-now th { background: var(--pink-soft); border-color: var(--pink); }
.datatable tr.row-done { color: var(--ink-soft); }
.datatable tr.row-done th::after { content: " ✓"; color: var(--mint); }

@media (max-width: 920px) {
  .hub, .bench { grid-template-columns: 1fr; }
  .lt-body { grid-template-columns: 1fr; }
  .lt-apps { flex-direction: row; flex-wrap: wrap; }
  .inbox { grid-template-columns: 1fr; }
  .inbox.has-open .mail-list, .inbox:not(.has-open) .mail-empty { display: none; }
  .mail-back { display: inline-block; }
  .ledger-stats { grid-template-columns: 1fr; }
  .visual-panel { position: static; }
  .topbar { padding: 10px 14px; } .meter { width: 70px; }
  .ticket { padding: 22px 20px; }
  h1 { font-size: 1.6rem; }
}
@media (max-width: 620px) { .rank { display: none; } .wordmark { font-size: 1.15rem; } .btn.big { padding: 10px 16px; font-size: .98rem; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .draw-in { stroke-dasharray: none; stroke-dashoffset: 0; }
}
</style>
