<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);

  --paper: #FBF9FF; --bg: #F1ECFB; --ink: #2A1F4A; --ink-soft: #5D5480; --line: #D9D0EE;
  --plot: #FFFFFF; --g-major: #CFC4EA; --g-minor: #E9E3F6;

}

    --bezel: #0B0818;
    --grid-1: rgba(241,236,255,.24); --grid-2: rgba(241,236,255,.16); --grid-3: rgba(241,236,255,.45); --stamp-bg: rgba(34,27,58,.7);
  }
}
:root[data-theme="dark"] {
  --paper: #221B3A; --bg: #17122A; --ink: #F1ECFF; --ink-soft: #B8AEDB; --line: #3D3363;
  --plot: #1D1733; --g-major: #4A3F75; --g-minor: #302852;
  --pink: #FF6F9F; --pink-soft: #4A2238; --violet: #A58FFF; --violet-soft: #2F2653;
  --sky: #4FC3EE; --sky-soft: #173A4A; --amber: #F2B64B; --mint: #5BD497; --mint-soft: #173B2C;

  --bezel: #0B0818;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; margin: 0 0 .4em; }
h1 { font-size: 2rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.15rem; }
p { margin: 0 0 .7em; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.small { font-size: .9rem; color: var(--ink-soft); }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: var(--paper); border-bottom: 2px solid var(--line); }
.wordmark { font-family: var(--display); font-size: 1.5rem; font-weight: 600; background: none; border: 0; cursor: pointer; padding: 0; color: var(--pink); letter-spacing: -.01em; }
.rank { display: flex; align-items: center; gap: 12px; font-size: .95rem; }
.rank-name { font-weight: 700; }
.meter { width: 120px; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--pink); border-radius: 5px; }
.rep { color: var(--ink-soft); }

/* buttons */
.btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 9px 20px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:not(:disabled):hover { transform: translateY(-1px); }
.small-btn { padding: 6px 14px; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.linkish { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: .9rem; }

/* hub */
.hub { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
.preview-banner { grid-column: 1 / -1; background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; font-size: .95rem; }
.lede { color: var(--ink-soft); max-width: 60ch; }
.path { list-style: none; margin: 20px 0 0; padding: 0; position: relative; }
.path::before { content: ""; position: absolute; left: 21px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
.node { position: relative; display: flex; gap: 18px; margin-bottom: 18px; }
.node-num { flex: none; width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 3px solid var(--pink); font-family: var(--display); font-size: 1.2rem; font-weight: 600; color: var(--pink); z-index: 1; }
.node.done .node-num { background: var(--pink); color: #fff; }
.node.locked .node-num { border-color: var(--line); color: var(--ink-soft); }
.node-body { flex: 1; background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 14px 18px; }
.node.locked .node-body { opacity: .65; }
.node-body h3 { margin-bottom: 2px; }
.client { color: var(--ink-soft); font-size: .95rem; margin-bottom: 6px; }
.client.big { font-size: 1.05rem; }
.stars span, .bigstars span { color: var(--line); } .stars span.on, .bigstars span.on { color: var(--amber); }
.stars { margin-bottom: 8px; letter-spacing: 2px; }
.lock-note { font-size: .9rem; color: var(--ink-soft); margin: 0; }
.badge { font-family: var(--body); font-size: .75rem; background: var(--warn-soft); border-radius: 6px; padding: 2px 8px; vertical-align: middle; }
.side { display: flex; flex-direction: column; gap: 20px; }
.bay-card { background: var(--sky-soft); border-radius: 18px; padding: 18px; border: 2px solid transparent; }
.bay-card h2 { color: var(--sky); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 2px solid var(--sky); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: .88rem; cursor: pointer; }
.chip-btn.strong { background: var(--sky); color: #fff; font-weight: 700; }
.shelf-card { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 18px; }
.shelf { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; font-size: .72rem; color: var(--ink-soft); }
.shelf li { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shelf-item { width: 48px; height: 48px; display: grid; place-items: center; font-size: 1.6rem; border-radius: 12px; background: var(--bg); color: var(--ink-soft); }
.shelf li.got .shelf-item { background: var(--pink-soft); }

/* intro + report ticket */
.intro, .report { max-width: 760px; margin: 0 auto; padding: 36px 24px 56px; }
.ticket { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 28px 32px; border-top: 10px solid var(--pink); }
.ticket-kicker { font-family: var(--display); color: var(--pink); font-size: 1.05rem; margin-bottom: 2px; }
.pitch { font-size: 1.12rem; max-width: 62ch; }
.bigstars { font-size: 2.6rem; letter-spacing: 6px; margin: 4px 0 8px; }
.results { list-style: none; padding: 0; margin: 0 0 16px; }
.results li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.res-mark { width: 18px; height: 18px; border-radius: 50%; }
.res-first .res-mark { background: var(--mint); } .res-helped .res-mark { background: var(--sky); } .res-shown .res-mark { background: var(--line); }
.res-how { color: var(--ink-soft); font-size: .92rem; }
.visited { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.visited li { border-radius: 999px; padding: 4px 12px; font-size: .9rem; }
.visited li.z-cal { background: var(--sky-soft); } .visited li.z-arc { background: var(--violet-soft); }
.promo { background: var(--pink-soft); border-radius: 12px; padding: 10px 14px; font-weight: 700; margin: 10px 0; }

/* case bench */
.casewrap { max-width: 1320px; margin: 0 auto; padding: 16px 20px 40px; }
.casebar, .zonebar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.casebar h2, .zonebar h2 { margin: 0; }
.casebar .client { margin: 0; }
.progress { display: flex; gap: 6px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--pink); }
.dot.did { background: var(--pink); } .dot.now { box-shadow: 0 0 0 3px var(--pink-soft); }
.build-tag { font-family: var(--display); color: var(--pink); }
.bench { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 22px; align-items: start; }
.visual-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.paper { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.work-panel { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 22px 24px; }
.skill { display: inline-block; font-size: .85rem; font-weight: 700; color: var(--violet); background: var(--violet-soft); border-radius: 999px; padding: 3px 12px; margin-bottom: 10px; }
.step-name { font-family: var(--display); color: var(--pink); font-size: 1.05rem; margin-bottom: 4px; }
.prompt { font-family: var(--body); font-weight: 700; font-size: 1.14rem; line-height: 1.45; }
.instr { color: var(--ink-soft); font-size: .95rem; }
.count { font-weight: 700; color: var(--pink); margin-left: 6px; }
.options { display: flex; flex-direction: column; gap: 9px; margin: 8px 0; }
.opt { display: flex; align-items: flex-start; gap: 12px; text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 11px 14px; cursor: pointer; line-height: 1.4; }
.opt:not(:disabled):hover { border-color: var(--ink-soft); }
.opt .box { flex: none; width: 20px; height: 20px; margin-top: 1px; border: 2px solid var(--ink-soft); border-radius: 6px; }
.opt.picked { border-color: var(--pink); background: var(--pink-soft); }
.opt.picked .box { background: var(--pink); border-color: var(--pink); box-shadow: inset 0 0 0 3px var(--pink-soft); }
.opt.is-right { border-color: var(--mint); background: var(--mint-soft); }
.opt.is-right .box { background: var(--mint); border-color: var(--mint); }
.opt.is-wrong { border-style: dashed; }
.opt:disabled { cursor: default; }
.fb { border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.fb-head { font-weight: 700; margin-bottom: 4px; }
.fb-correct { background: var(--mint-soft); border-left: 6px solid var(--mint); }
.fb-reveal, .fb-retry { background: var(--warn-soft); border-left: 6px solid var(--amber); }
.fb-mission.z-cal { background: var(--sky-soft); border-left: 6px solid var(--sky); }
.fb-mission.z-arc { background: var(--violet-soft); border-left: 6px solid var(--violet); }
.fb-where { font-family: var(--display); font-size: .95rem; margin: 0; }
.z-cal .fb-where { color: var(--sky); } .z-arc .fb-where { color: var(--violet); }
.earned { color: var(--pink); margin-left: 6px; }
.tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.tab { border: 2px solid var(--line); background: var(--paper); border-radius: 10px 10px 0 0; padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.tab[aria-selected="true"] { border-color: var(--pink); color: var(--pink); }
.tab-note { font-size: .85rem; color: var(--ink-soft); margin-left: 6px; }
.built-badge { position: absolute; right: 16px; bottom: 14px; font-size: .78rem; font-weight: 700; background: var(--pink-soft); color: var(--pink); border-radius: 999px; padding: 2px 10px; }
.hint { font-size: .88rem; color: var(--ink-soft); margin-top: 8px; }
.talk { list-style: none; padding: 0; margin: 0 0 10px; }
.talk li { padding: 7px 0 7px 32px; position: relative; border-bottom: 1px solid var(--line); }
.talk li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.talk li.ok::before { background: var(--mint); border-color: var(--mint); }
.talk strong { color: var(--pink); font-size: 1.1em; }
.blank-grid { margin-top: 10px; height: 220px; border-radius: 8px; background-color: var(--plot); background-image: linear-gradient(var(--g-major) 1px, transparent 1px), linear-gradient(90deg, var(--g-major) 1px, transparent 1px); background-size: 28px 28px; opacity: .8; }

/* top bar HUD */
.hud { display: flex; align-items: center; gap: 14px; }
.funds { font-family: var(--display); font-weight: 600; color: var(--mint); background: var(--mint-soft); border-radius: 999px; padding: 3px 12px; }
.inbox-btn { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 3px 10px; cursor: pointer; font-size: 1.15rem; }
.badge-n { position: absolute; top: -9px; right: -9px; background: var(--pink); color: #fff; border-radius: 999px; font-size: .75rem; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; font-weight: 700; font-family: var(--body); }
.badge-n.inline { position: static; display: inline-grid; margin-left: 6px; vertical-align: middle; }
/* room */
.roomwrap { max-width: 1000px; margin: 0 auto; padding: 14px 20px 40px; }
.room-stage { margin: 0 auto; background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 10px; }
.room-stage.decorating { border-color: var(--pink); border-style: dashed; }
.room { position: relative; width: 100%; height: 0; }
.room .layer { position: absolute; height: auto; pointer-events: none; user-select: none; -webkit-user-select: none; }
.room .layer.ghost { opacity: .3; filter: grayscale(1); }
.hotspot { position: absolute; background: transparent; border: 3px dashed transparent; border-radius: 16px; cursor: pointer; padding: 0; }
.hotspot span { position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%); background: var(--bezel); color: var(--bezel-text); font-weight: 700; font-size: .85rem; padding: 3px 12px; border-radius: 999px; white-space: nowrap; }
.hotspot:hover, .hotspot:focus-visible { border-color: var(--pink); background: rgba(217, 58, 114, .06); }
.price-tag { position: absolute; transform: translate(-50%, -50%); background: var(--paper); border: 2px dashed var(--pink); color: var(--pink); font-weight: 700; border-radius: 999px; padding: 1px 7px; cursor: pointer; font-size: .74rem; }
.room-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.btn.big { font-size: 1.05rem; padding: 12px 22px; }
.btn.on { background: var(--pink-soft); border-color: var(--pink); }
.center { text-align: center; margin-top: 10px; }
.toast { background: var(--mint-soft); border-left: 6px solid var(--mint); padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-weight: 700; }
.bubble { position: absolute; transform: translate(-50%, -120%); background: var(--paper); border: 2px solid var(--bezel); border-radius: 14px; padding: 4px 12px; font-weight: 700; font-size: .9rem; white-space: nowrap; animation: pop .45s cubic-bezier(.2, 1.6, .5, 1) both; }
@keyframes pop { from { transform: translate(-50%, -120%) scale(.3); opacity: 0; } to { transform: translate(-50%, -120%) scale(1); opacity: 1; } }
.room .layer.cheer { animation: hop .5s ease-in-out 3; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }
/* laptop */
.laptopwrap { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; }
.laptop { background: var(--bezel); border-radius: 22px; padding: 10px; }
.lt-bar { display: flex; justify-content: space-between; align-items: center; color: var(--bezel-text); padding: 4px 8px 10px; font-family: var(--display); }
.lt-bar .btn { color: var(--bezel-text); border-color: rgba(255, 255, 255, .35); background: transparent; }
.lt-body { display: grid; grid-template-columns: 200px minmax(0, 1fr); background: var(--paper); border-radius: 14px; min-height: 540px; overflow: hidden; }
.lt-apps { background: var(--bg); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.lt-app { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; }
.lt-app.on { background: var(--paper); color: var(--pink); }
.lt-main { padding: 18px 20px; min-width: 0; }
.inbox { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; }
.mail-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mail { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 9px 12px; cursor: pointer; display: grid; gap: 2px; }
.mail.unread { border-color: var(--pink); } .mail.unread .mail-subj { font-weight: 700; }
.mail.current { background: var(--pink-soft); }
.mail-from { font-size: .8rem; color: var(--ink-soft); }
.mail-subj { font-size: .95rem; line-height: 1.3; }
.mail-tag { justify-self: start; font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--bg); margin-top: 3px; }
.t-open { background: var(--pink-soft); color: var(--pink); } .t-reply { background: var(--mint-soft); color: var(--mint); }
.t-locked, .t-teaser, .t-soon { background: var(--warn-soft); } .t-done { background: var(--sky-soft); }
.mail-view { border: 2px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.mail-back { display: none; margin: -6px 0 6px; padding: 4px 0; }
.mail-empty { display: grid; place-items: center; color: var(--ink-soft); border: 2px dashed var(--line); border-radius: 14px; min-height: 220px; }
.pay-line { font-family: var(--display); color: var(--mint); font-size: 1.05rem; } .pay-line.big { font-size: 1.35rem; }
.needs { background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; }
.shop-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.shop-h { margin-top: 18px; }
.shop-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.item { display: flex; gap: 12px; border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.thumb { flex: none; width: 86px; height: 86px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; overflow: hidden; }
.thumb img { max-width: 88%; max-height: 88%; }
.item h4 { margin: 0; font-family: var(--display); font-size: 1.02rem; font-weight: 600; }
.price { font-weight: 700; color: var(--pink); margin: 0 0 2px; }
.unlock { font-size: .85rem; font-weight: 700; color: var(--violet); margin: 4px 0 0; }
.inlab { font-weight: 700; color: var(--mint); align-self: center; }
.item .row { margin-top: 8px; align-items: center; }
.item .btn { padding: 6px 14px; font-size: .88rem; white-space: nowrap; }
.ledger-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.ledger-stats > div { background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.ledger-stats p { margin: 0; }
.backup { background: var(--bg); border-radius: 14px; padding: 4px 16px 14px; margin: 18px 0; }
.backup h3 { margin-top: 12px; }
.load-line { margin-top: 18px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.big-num { font-family: var(--display); font-size: 1.5rem; font-weight: 600; }
.lab-name-preview { font-family: var(--display); font-size: 1.9rem; color: var(--pink); margin: 18px 0 4px; font-weight: 600; }

/* case brief + remember */
.brief-toggle { margin-top: 4px; font-size: .92rem; }
.brief-toggle summary { cursor: pointer; color: var(--pink); font-weight: 700; }
.brief-toggle p { max-width: 60ch; margin: 6px 0 0; }
.brief { background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: .95rem; }
.brief p:last-child { margin: 0; }
.brief-label { font-family: var(--display); font-size: .95rem; margin: 0 0 2px; color: var(--pink); }
.remember { border-radius: 12px; padding: 10px 14px; margin: 8px 0 10px; font-size: .95rem; }
.remember p:last-child { margin: 0; }
.remember.z-cal { background: var(--sky-soft); } .remember.z-cal .brief-label, .explain .brief-label { color: var(--sky); }
.remember.z-arc { background: var(--violet-soft); } .remember.z-arc .brief-label { color: var(--violet); }
.stage { display: flex; gap: 8px; margin: 0; }
.stage span { border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .88rem; color: var(--ink-soft); }
.stage span.on { border-color: var(--sky); color: var(--ink); font-weight: 700; }

/* zones */
.zone.z-cal .zonebar h2 { color: var(--sky); } .zone.z-arc .zonebar h2 { color: var(--violet); }
.zone.z-cal .work-panel { border-color: var(--sky); } .zone.z-arc .work-panel { border-color: var(--violet); }
.explain { background: var(--sky-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.archive-card { background: var(--violet-soft); border-radius: 18px; padding: 26px 28px; border: 2px solid var(--violet); }
.archive-card h3 { color: var(--violet); font-size: 1.5rem; }
.archive-card p:last-child { font-size: 1.2rem; margin: 8px 0 0; }
.streak { font-weight: 700; color: var(--sky); margin: 0; }

/* svg visuals */
.viz { width: 100%; height: auto; display: block; font-family: var(--body); }
.plot-target { cursor: crosshair; touch-action: none; }
.viz .g-major { stroke: var(--grid-1); stroke-width: 1.2; }
.viz .g-minor { stroke: var(--grid-2); stroke-width: 1; }
.viz .g-decade { stroke: var(--grid-3); stroke-width: 1.8; }
.viz .frame { fill: none; stroke: var(--ink); stroke-width: 2; }
.viz .tick { fill: var(--ink); font-size: 14px; }
.viz .v-title { fill: var(--ink); font-family: var(--display); font-weight: 600; font-size: 19px; }
.viz .ax-title { fill: var(--ink); font-weight: 700; font-size: 15px; }
.viz .legend { fill: var(--ink); font-size: 13px; }
.viz .bar { fill: var(--pink); }
.viz .boundary { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.viz .r-solid { fill: var(--r-solid); } .viz .r-liquid { fill: var(--r-liquid); } .viz .r-gas { fill: var(--r-gas); }
.viz .region-label { fill: var(--ink); font-family: var(--display); font-size: 22px; font-weight: 600; paint-order: stroke; stroke: var(--plot); stroke-width: 4px; }
.viz .pt-dot { fill: var(--ink); }
.viz .pt-label, .viz .hl-label { fill: var(--ink); font-size: 13px; font-weight: 700; paint-order: stroke; stroke: var(--plot); stroke-width: 4px; }
.viz .hl-label { font-size: 15px; }
.viz .hl-ring { fill: none; stroke: var(--ink); stroke-width: 3; }
.viz .hl-dot { fill: var(--ink); }
.viz .arrow { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 8 5; }
.viz .pending line { stroke: var(--pink); stroke-width: 1.5; stroke-dasharray: 4 4; }
.viz .pending circle { fill: none; stroke: var(--pink); stroke-width: 3; }
.viz .ghost { fill: none; stroke: var(--mint); stroke-width: 3; stroke-dasharray: 5 4; }
.draw-in { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 1.2s ease-out .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.stamp { position: absolute; font-family: var(--display); font-weight: 600; font-size: 2.2rem; color: var(--pink); border: 5px solid var(--pink); border-radius: 12px; padding: 2px 18px; transform: rotate(-12deg); opacity: .9; animation: stamp .45s cubic-bezier(.2, 1.6, .5, 1) .9s both; background: var(--stamp-bg); }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .9; } }

/* tables */
.table-wrap { overflow-x: auto; }
.datatable { border-collapse: collapse; width: 100%; font-size: 1rem; }
.datatable caption { font-family: var(--display); font-weight: 600; font-size: 1.1rem; text-align: left; padding: 4px 4px 10px; }
.datatable th, .datatable td { border: 2px solid var(--line); padding: 9px 12px; text-align: center; }
.datatable thead th { background: var(--violet-soft); font-size: .95rem; }
.datatable tbody th { font-weight: 700; }
.datatable tr.row-now td, .datatable tr.row-now th { background: var(--pink-soft); border-color: var(--pink); }
.datatable tr.row-done { color: var(--ink-soft); }
.datatable tr.row-done th::after { content: " ✓"; color: var(--mint); }

@media (max-width: 920px) {
  .hub, .bench { grid-template-columns: 1fr; }
  .lt-body { grid-template-columns: 1fr; }
  .lt-apps { flex-direction: row; flex-wrap: wrap; }
  .inbox { grid-template-columns: 1fr; }
  .inbox.has-open .mail-list, .inbox:not(.has-open) .mail-empty { display: none; }
  .mail-back { display: inline-block; }
  .ledger-stats { grid-template-columns: 1fr; }
  .visual-panel { position: static; }
  .topbar { padding: 10px 14px; } .meter { width: 70px; }
  .ticket { padding: 22px 20px; }
  h1 { font-size: 1.6rem; }
}
@media (max-width: 620px) { .rank { display: none; } .wordmark { font-size: 1.15rem; } .btn.big { padding: 10px 16px; font-size: .98rem; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .draw-in { stroke-dasharray: none; stroke-dashoffset: 0; }
}

 value","type":"Multiple choice","visuals":[],"prompt":"Rook wants the water to glow blue when its molecules reach 650 m/s. The scientists never measured 650 m/s, so use the line. At what temperature does that happen?","why":"Find 650 m/s on the y-axis, go straight across to the line, then straight down: 20°C. There's no dot there. The line shows values between the measurements."},{"id":"MM-02","caseId":"MOVIN-MOLECULES","order":2,"role":"Main","forTag":"","skill":"Read the scale","type":"Multiple choice","visuals":[],"prompt":"Rook's desert level is 80°C, but the scientists never measured 80°C. Based on the line, about how fast are the molecules moving at 80°C?","why":"Go straight up from 80°C to the line. It crosses a little above halfway between the 700 and 750 gridlines: about 725 m/s."},{"id":"MM-03","caseId":"MOVIN-MOLECULES","order":3,"role":"Main","forTag":"","skill":"Identify a trend","type":"Multiple choice","visuals":[],"prompt":"Rook needs one rule for the game engine. Which statement best describes the overall trend?","why":"From the first point to the last, the line keeps rising: hotter water, faster molecules."},{"id":"MM-04","caseId":"MOVIN-MOLECULES","order":4,"role":"Main","forTag":"","skill":"Compare","type":"Pick two","visuals":[],"prompt":"Rook wants to know where heating makes the biggest difference. Pick the TWO sections where the line is steepest, where speed rises fastest for each degree of warming.","why":"From -20 to 0°C, speed rose 50 m/s over 20 degrees. From 0 to 40°C, it rose 100 m/s over 40 degrees. Both are 2.5 m/s for every degree, the same steepness. After 40°C the line flattens out."},{"id":"MM-05","caseId":"MOVIN-MOLECULES","order":5,"role":"Main","forTag":"","skill":"Predict / extrapolate","type":"Multiple choice","visuals":[],"prompt":"Rook wants a bonus level with superheated steam at 140°C. Based on the pattern, what is the best prediction?","why":"The speed keeps rising, but the line flattens near the end, so expect a little faster than 750 m/s."},{"id":"MM-06","caseId":"MOVIN-MOLECULES","order":6,"role":"Main","forTag":"","skill":"Apply the science","type":"Pick two","visuals":[],"prompt":"Rook wants the in-game science tips to be accurate. Pick the TWO statements supported by the graph AND by science.","why":"Hotter water has more average kinetic energy, and even ice at -20°C has molecules moving at 550 m/s."},{"id":"MM-07","caseId":"MOVIN-MOLECULES","order":7,"role":"Main","forTag":"","skill":"Select evidence","type":"Select all that apply","visuals":[],"prompt":"A coworker claims: \"Heating water makes its molecules speed up.\" Select ALL the statements that are evidence for this claim.","why":"Evidence must be true AND show that heating led to more speed. The water being a liquid is true but doesn't show speed changing."},{"id":"MM-08","caseId":"MOVIN-MOLECULES","order":8,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Rook's next level is at the bottom of a deep ocean, where the pressure is very high. Can THIS graph tell Rook whether the water there is a solid, liquid, or gas?","why":"Check the axes: this graph only shows temperature and molecule speed. Pressure isn't on it anywhere, so it can't answer a pressure question. A phase diagram shows temperature AND pressure."},{"id":"CP-01","caseId":"COLD-PACK","order":1,"role":"Main","forTag":"","skill":"Read a value","type":"Multiple choice","visuals":["CP-GRAPH"],"prompt":"What was the water temperature with urea at 4 minutes?","why":"Find the urea line in the key, go to 4 minutes, and read across: 7°C, between the 5 and 10 gridlines."},{"id":"CP-02","caseId":"COLD-PACK","order":2,"role":"Main","forTag":"","skill":"Identify a trend","type":"Multiple choice","visuals":["CP-GRAPH"],"prompt":"Which statement describes the ammonium nitrate line from 0 to 10 minutes?","why":"It plunges from 22°C to 3°C in 4 minutes, then slowly warms back up as the room adds thermal energy."},{"id":"CP-03","caseId":"COLD-PACK","order":3,"role":"Main","forTag":"","skill":"Apply the science","type":"Pick two","visuals":["CP-GRAPH"],"prompt":"Pick the TWO statements that explain why an ammonium nitrate pack feels cold on an injured ankle.","why":"Dissolving ammonium nitrate absorbs thermal energy, so thermal energy flows out of your warm skin into the pack."},{"id":"CP-04","caseId":"COLD-PACK","order":4,"role":"Main","forTag":"","skill":"Compare","type":"Select all that apply","visuals":["CP-GRAPH"],"prompt":"Coach Rivera's rules: the pack must be below 10°C at 2 minutes AND still below 10°C at 8 minutes. Select ALL the substances that meet both rules.","why":"Ammonium nitrate (6°C, then 6°C) and urea (9°C, then 8°C) both pass. Urea is close to the 10°C line, so read carefully!"},{"id":"CP-05","caseId":"COLD-PACK","order":5,"role":"Main","forTag":"","skill":"Evaluate a claim","type":"Multiple choice","visuals":["CP-GRAPH","CP-COST"],"prompt":"An assistant says: \"Ammonium nitrate is the best choice because it gets the coldest.\" Using the graph AND the cost table, what's the best response?","why":"Both ammonium nitrate and urea meet Coach's rules, and urea costs $0.35 less per pack. Coldest isn't the only thing that matters."},{"id":"CP-06","caseId":"COLD-PACK","order":6,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":["CP-GRAPH"],"prompt":"The team also needs HOT packs for sore muscles. Which substance should go in them?","why":"Calcium chloride made the water warmer: dissolving it releases thermal energy."},{"id":"CP-07","caseId":"COLD-PACK","order":7,"role":"Main","forTag":"","skill":"Compare","type":"Multiple choice","visuals":["CP-GRAPH"],"prompt":"Which substance changed the water temperature the LEAST?","why":"The sodium chloride line is almost flat: it barely moved from 22°C."},{"id":"PH-01","caseId":"PHASE-PROBE","order":1,"role":"Main","forTag":"","skill":"Read a value","type":"Multiple choice","visuals":[],"prompt":"Landing site Alpha is 20°C with a pressure of 6 atm. What state is water at site Alpha?","why":"Find 20°C across and 6 atm up. They meet in the liquid region."},{"id":"PH-02","caseId":"PHASE-PROBE","order":2,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"At site Alpha (20°C, 6 atm), what are the water molecules doing?","why":"Water at site Alpha is a liquid, and liquid particles slide past one another while staying close together."},{"id":"PH-03","caseId":"PHASE-PROBE","order":3,"role":"Main","forTag":"","skill":"Read the scale","type":"Multiple choice","visuals":[],"prompt":"Normal air pressure on Earth is 1 atm. According to the diagram, at what temperature does water boil at 1 atm?","why":"1 atm is halfway between the 0 and 2 gridlines. Slide right until you hit the boiling line: 100°C."},{"id":"PH-04","caseId":"PHASE-PROBE","order":4,"role":"Main","forTag":"","skill":"Compare","type":"Multiple choice","visuals":[],"prompt":"At which landing site do the water molecules have the greatest average kinetic energy?","why":"Average kinetic energy follows temperature. 150°C is the hottest site, even though its pressure is low."},{"id":"PH-05","caseId":"PHASE-PROBE","order":5,"role":"Main","forTag":"","skill":"Predict / extrapolate","type":"Multiple choice","visuals":[],"prompt":"A water sample starts at 20°C and 4 atm. The pressure stays at 4 atm while the probe heats it to 180°C. What happens?","why":"At 4 atm, move straight right from 20°C to 180°C. You start in liquid and cross the boiling line into gas."},{"id":"PH-06","caseId":"PHASE-PROBE","order":6,"role":"Main","forTag":"","skill":"Predict / extrapolate","type":"Multiple choice","visuals":[],"prompt":"Water vapor at 160°C and 2 atm is pumped into a chamber. The temperature stays at 160°C while the pressure rises to 10 atm. What happens?","why":"At 160°C, move straight up from 2 atm to 10 atm. You start in gas and cross into liquid. Pressure alone changed the state!"},{"id":"PH-07","caseId":"PHASE-PROBE","order":7,"role":"Main","forTag":"","skill":"Read a value","type":"Select all that apply","visuals":[],"prompt":"Select ALL the landing sites where the probe would find liquid water.","why":"20°C/6 atm, 50°C/8 atm, and 100°C/10 atm all land in the liquid region."},{"id":"PH-08","caseId":"PHASE-PROBE","order":8,"role":"Main","forTag":"","skill":"Select evidence","type":"Pick two","visuals":[],"prompt":"Captain Park claims: \"Raising the pressure can turn water vapor into liquid water, even when the temperature doesn't change.\" Pick the TWO statements that are evidence for her claim.","why":"Both show the SAME temperature, with a higher pressure causing a change from gas to liquid."},{"id":"DI-01","caseId":"DRY-ICE","order":1,"role":"Main","forTag":"","skill":"Read the scale","type":"Multiple choice","visuals":[],"prompt":"Look at the pressure axis. What pressure is at the triple point, where solid, liquid, and gas meet?","why":"Start at the 1 atm line and count up: the unlabeled lines mean 2, 3, 4, 5... The triple point sits at about 5 atm."},{"id":"DI-02","caseId":"DRY-ICE","order":2,"role":"Main","forTag":"","skill":"Read a value","type":"Multiple choice","visuals":[],"prompt":"Mack stores dry ice at normal air pressure, 1 atm, at -100°C. What state is the carbon dioxide?","why":"Find -100°C across and 1 atm up. They meet in the solid region."},{"id":"DI-03","caseId":"DRY-ICE","order":3,"role":"Main","forTag":"","skill":"Predict / extrapolate","type":"Multiple choice","visuals":[],"prompt":"On stage, the dry ice stays at 1 atm while it warms from -100°C up to room temperature, 20°C. What happens to it?","why":"At 1 atm, move straight right. You go from solid directly into gas. The line at 1 atm never passes through the liquid region!"},{"id":"DI-04","caseId":"DRY-ICE","order":4,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"What is the name for the change you just traced, when a solid turns directly into a gas?","why":"Sublimation is solid straight to gas, skipping the liquid. That's why dry ice never leaves a puddle."},{"id":"DI-05","caseId":"DRY-ICE","order":5,"role":"Main","forTag":"","skill":"Read the scale","type":"Pick two","visuals":[],"prompt":"Mack wonders if CO2 can ever be a liquid. Pick the TWO conditions where carbon dioxide is a liquid.","why":"-40°C/20 atm and 0°C/50 atm both land in the liquid region. Liquid CO2 needs a lot of pressure: more than 5 atm!"},{"id":"DI-06","caseId":"DRY-ICE","order":6,"role":"Main","forTag":"","skill":"Compare","type":"Multiple choice","visuals":[],"prompt":"At which condition do carbon dioxide molecules have the greatest average kinetic energy?","why":"10°C is the highest temperature on the list, so it has the greatest average kinetic energy, even at a low pressure."},{"id":"DI-07","caseId":"DRY-ICE","order":7,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Once the dry ice has turned into gas on stage, what are the carbon dioxide particles doing?","why":"Gas particles move freely and spread far apart, which is why the CO2 spreads across the stage floor."},{"id":"BL-01","caseId":"BOUNCE-LAB","order":1,"role":"Main","forTag":"","skill":"Read a value","type":"Multiple choice","visuals":["BL-TABLE"],"prompt":"What was the air pressure inside the ball at 20°C?","why":"Find the 20°C row, then slide across to the pressure column: 8.0 psi."},{"id":"BL-02","caseId":"BOUNCE-LAB","order":2,"role":"Main","forTag":"","skill":"Read the scale","type":"Multiple choice","visuals":["BL-BARS"],"prompt":"About how much higher did the ball bounce at 40°C than at 0°C?","why":"The 40°C bar is about 138 cm and the 0°C bar is about 108 cm: a difference of about 30 cm."},{"id":"BL-03","caseId":"BOUNCE-LAB","order":3,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":["BL-TABLE"],"prompt":"Why did the air pressure inside the ball go up as the ball warmed?","why":"Warmer air particles move faster, so they hit the inside of the ball harder and more often. More hits = more pressure."},{"id":"BL-04","caseId":"BOUNCE-LAB","order":4,"role":"Main","forTag":"","skill":"Predict / extrapolate","type":"Pick two","visuals":["BL-TABLE"],"prompt":"Priya left the 60°C row blank. Pick the TWO predictions that fit the pattern in her data.","why":"Pressure went up 1.5 psi every 20°C, so about 11 psi at 60°C. Bounce height kept rising, so higher than 138 cm."},{"id":"BL-05","caseId":"BOUNCE-LAB","order":5,"role":"Main","forTag":"","skill":"Select evidence","type":"Select all that apply","visuals":["BL-TABLE","BL-BARS"],"prompt":"Claim: \"The ball bounces higher when it is warmer.\" Select ALL the evidence that supports the claim.","why":"Both statements come straight from the data and show bounce rising with temperature."},{"id":"BL-06","caseId":"BOUNCE-LAB","order":6,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":["BL-TABLE"],"prompt":"Priya pumps more air into a ball without changing its temperature. What happens inside?","why":"More particles in the same space means more collisions with the walls, so the pressure rises."},{"id":"BL-07","caseId":"BOUNCE-LAB","order":7,"role":"Main","forTag":"","skill":"Apply the science","type":"Multiple choice","visuals":["BL-TABLE"],"prompt":"A pump can squeeze lots of extra air into a basketball, but you can't squeeze extra water into a full water bottle. Why?","why":"Gas particles have lots of empty space between them. Liquid particles are already close together, so there's no room to squeeze."},{"id":"CK-KE-1","caseId":"","order":1,"role":"Check","forTag":"SCI-KE-TEMP","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Four sealed containers hold the same gas. In which container do the particles have the greatest average kinetic energy?","why":"The hottest container wins. Temperature measures average kinetic energy; pressure doesn't."},{"id":"CK-KE-2","caseId":"","order":2,"role":"Check","forTag":"SCI-KE-TEMP","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Tank A holds air at 10°C and 20 atm. Tank B holds air at 60°C and 2 atm. Which tank's particles have more average kinetic energy?","why":"Tank B is hotter, so its particles have more average kinetic energy. The high pressure in Tank A doesn't change that."},{"id":"CK-MOT-1","caseId":"","order":1,"role":"Check","forTag":"SCI-MOTION-STATES","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"In which state do particles vibrate in place but NOT move past each other?","why":"Solid particles are locked in position. They vibrate but don't slide or spread out."},{"id":"CK-MOT-2","caseId":"","order":2,"role":"Check","forTag":"SCI-MOTION-STATES","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Juice is poured into a cup. What are the juice particles doing?","why":"Juice is a liquid: its particles stay close together but slide past one another, so it can flow."},{"id":"CK-STOP-1","caseId":"","order":1,"role":"Check","forTag":"SCI-PARTICLES-STOP","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A block of ice sits in a freezer at -10°C. What are its water molecules doing?","why":"Frozen doesn't mean stopped. Ice molecules vibrate in place."},{"id":"CK-SPD-1","caseId":"","order":1,"role":"Check","forTag":"SCI-SPEED-TEMP","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A pot of water is heated from 30°C to 70°C. What happens to its molecules?","why":"Adding thermal energy speeds particles up."},{"id":"CK-GP-1","caseId":"","order":1,"role":"Check","forTag":"SCI-GRAPH-PURPOSE","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Which graph would best answer: \"Is carbon dioxide a solid, liquid, or gas at -60°C and 5 atm?\"","why":"A question about state at a temperature AND a pressure needs a phase diagram."},{"id":"CK-EV-1","caseId":"","order":1,"role":"Check","forTag":"SCI-EVIDENCE","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Claim: \"Ice melts faster in a warm room.\" Which statement is evidence for this claim?","why":"It's true AND it compares warm vs. cool rooms, which is exactly what the claim is about."},{"id":"CK-PC-1","caseId":"","order":1,"role":"Check","forTag":"SCI-PARTICLES-CHANGE","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A balloon is carried from a hot car into a cold house, and it shrinks. What happened to the air particles inside?","why":"The particles themselves didn't change. They slowed down and moved closer together."},{"id":"CK-PS-1","caseId":"","order":1,"role":"Check","forTag":"SCI-PRESSURE-SOURCE","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A sealed jar of air is warmed. Why does the pressure inside go up?","why":"Faster particles hit the jar's walls harder and more often. That's what pressure is."},{"id":"CK-CMP-1","caseId":"","order":1,"role":"Check","forTag":"SCI-COMPRESS","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A small tank for a camping stove holds a LOT of gas. How is that possible?","why":"Gas particles have lots of empty space between them, so they can be pushed much closer together."},{"id":"CK-PM-1","caseId":"","order":1,"role":"Check","forTag":"SCI-PARTICLE-MODEL","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A pool float goes a little flat on a chilly night. Which answer explains it using particles?","why":"A particle explanation talks about the particles: here, the air particles slowed down and moved closer together."},{"id":"CK-EE-1","caseId":"","order":1,"role":"Check","forTag":"SCI-ENDO-EXO","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"You hold an ice cube and your hand feels cold. What is happening?","why":"Thermal energy moves from warmer to cooler: out of your hand and into the ice."},{"id":"CK-EE-2","caseId":"","order":2,"role":"Check","forTag":"SCI-ENDO-EXO","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"A hand-warmer packet gets hot when you open it. Which statement is true?","why":"A hand warmer releases thermal energy, which flows into your cooler hands."},{"id":"CK-PN-1","caseId":"","order":1,"role":"Check","forTag":"SCI-PHASE-NAMES","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"Frost forms on a window when water vapor turns directly into ice. What is this change called?","why":"Gas straight to solid is deposition, the reverse of sublimation."},{"id":"CK-PN-2","caseId":"","order":2,"role":"Check","forTag":"SCI-PHASE-NAMES","skill":"Apply the science","type":"Multiple choice","visuals":[],"prompt":"At 0°C and 1 atm, ice turns into liquid water. What is this change called?","why":"Solid to liquid is melting. (Liquid to solid is freezing.)"}],"options":[{"qid":"MM-01","letter":"A","text":"20°C","correct":true,"tag":""},{"qid":"MM-01","letter":"B","text":"650°C","correct":false,"tag":"CAL-AXIS"},{"qid":"MM-01","letter":"C","text":"40°C","correct":false,"tag":"CAL-POINT"},{"qid":"MM-01","letter":"D","text":"0°C","correct":false,"tag":"CAL-POINT"},{"qid":"MM-02","letter":"A","text":"About 725 m/s","correct":true,"tag":""},{"qid":"MM-02","letter":"B","text":"About 750 m/s","correct":false,"tag":"CAL-SCALE"},{"qid":"MM-02","letter":"C","text":"About 700 m/s","correct":false,"tag":"CAL-SCALE"},{"qid":"MM-02","letter":"D","text":"About 80 m/s","correct":false,"tag":"CAL-AXIS"},{"qid":"MM-03","letter":"A","text":"As temperature increases, molecule speed increases.","correct":true,"tag":""},{"qid":"MM-03","letter":"B","text":"As temperature increases, molecule speed decreases.","correct":false,"tag":"CAL-TREND"},{"qid":"MM-03","letter":"C","text":"Molecule speed stays about the same at every temperature.","correct":false,"tag":"CAL-TREND"},{"qid":"MM-03","letter":"D","text":"Molecule speed increases until 100°C, then decreases.","correct":false,"tag":"CAL-TREND"},{"qid":"MM-04","letter":"A","text":"From -20°C to 0°C","correct":true,"tag":""},{"qid":"MM-04","letter":"B","text":"From 0°C to 40°C","correct":true,"tag":""},{"qid":"MM-04","letter":"C","text":"From 40°C to 100°C","correct":false,"tag":"CAL-SPACING"},{"qid":"MM-04","letter":"D","text":"From 100°C to 120°C","correct":false,"tag":"CAL-TREND"},{"qid":"MM-05","letter":"A","text":"A little faster than 750 m/s","correct":true,"tag":""},{"qid":"MM-05","letter":"B","text":"Much faster, around 900 m/s","correct":false,"tag":"CAL-PREDICT"},{"qid":"MM-05","letter":"C","text":"Exactly 750 m/s, because molecules reach a top speed","correct":false,"tag":"SCI-SPEED-TEMP"},{"qid":"MM-05","letter":"D","text":"Slower than 750 m/s","correct":false,"tag":"SCI-SPEED-TEMP"},{"qid":"MM-06","letter":"A","text":"As water gets hotter, its molecules have more average kinetic energy.","correct":true,"tag":""},{"qid":"MM-06","letter":"B","text":"The molecules in ice at -20°C are still moving.","correct":true,"tag":""},{"qid":"MM-06","letter":"C","text":"The molecules at -20°C are not moving because the water is frozen.","correct":false,"tag":"SCI-PARTICLES-STOP"},{"qid":"MM-06","letter":"D","text":"Molecules move faster when the pressure increases.","correct":false,"tag":"SCI-KE-TEMP"},{"qid":"MM-06","letter":"E","text":"Each molecule gets bigger as the water heats up.","correct":false,"tag":"SCI-PARTICLES-CHANGE"},{"qid":"MM-07","letter":"A","text":"At -20°C the speed was 550 m/s; at 0°C it was 600 m/s.","correct":true,"tag":"SCI-EVIDENCE"},{"qid":"MM-07","letter":"B","text":"Every time the temperature went up, the speed went up.","correct":true,"tag":"SCI-EVIDENCE"},{"qid":"MM-07","letter":"C","text":"At 100°C the speed was 700 m/s.","correct":false,"tag":"CAL-POINT"},{"qid":"MM-07","letter":"D","text":"Water is a liquid at 40°C.","correct":false,"tag":"SCI-EVIDENCE"},{"qid":"MM-07","letter":"E","text":"The fastest speed was measured at the highest temperature.","correct":true,"tag":"SCI-EVIDENCE"},{"qid":"MM-08","letter":"A","text":"No. Pressure isn't on this graph, so it can't show what high pressure does. Rook needs a phase diagram.","correct":true,"tag":""},{"qid":"MM-08","letter":"B","text":"Yes. Find the ocean's temperature on the x-axis and read the answer.","correct":false,"tag":"SCI-GRAPH-PURPOSE"},{"qid":"MM-08","letter":"C","text":"Yes. The place where the line flattens out shows where water turns into a gas.","correct":false,"tag":"SCI-GRAPH-PURPOSE"},{"qid":"CP-01","letter":"A","text":"7°C","correct":true,"tag":""},{"qid":"CP-01","letter":"B","text":"3°C","correct":false,"tag":"CAL-SERIES"},{"qid":"CP-01","letter":"C","text":"9°C","correct":false,"tag":"CAL-POINT"},{"qid":"CP-01","letter":"D","text":"5°C","correct":false,"tag":"CAL-SCALE"},{"qid":"CP-02","letter":"A","text":"It drops quickly, then slowly warms back up.","correct":true,"tag":""},{"qid":"CP-02","letter":"B","text":"It keeps getting colder the whole time.","correct":false,"tag":"CAL-TREND"},{"qid":"CP-02","letter":"C","text":"It stays at about the same temperature.","correct":false,"tag":"CAL-TREND"},{"qid":"CP-02","letter":"D","text":"It rises quickly, then slowly cools down.","correct":false,"tag":"CAL-SERIES"},{"qid":"CP-03","letter":"A","text":"Dissolving it absorbs thermal energy from the water around it.","correct":true,"tag":""},{"qid":"CP-03","letter":"B","text":"Thermal energy moves from your warm skin into the colder pack.","correct":true,"tag":""},{"qid":"CP-03","letter":"C","text":"The pack gives off cold that flows into your skin.","correct":false,"tag":"SCI-ENDO-EXO"},{"qid":"CP-03","letter":"D","text":"The particles in the pack stop moving.","correct":false,"tag":"SCI-PARTICLES-STOP"},{"qid":"CP-03","letter":"E","text":"The pack releases thermal energy into your ankle.","correct":fal ":"A","text":"Vibrating in place","correct":true,"tag":""},{"qid":"CK-STOP-1","letter":"B","text":"Not moving at all","correct":false,"tag":"SCI-PARTICLES-STOP"},{"qid":"CK-STOP-1","letter":"C","text":"Moving freely around the freezer","correct":false,"tag":"SCI-MOTION-STATES"},{"qid":"CK-SPD-1","letter":"A","text":"They move faster.","correct":true,"tag":""},{"qid":"CK-SPD-1","letter":"B","text":"They move slower.","correct":false,"tag":"SCI-SPEED-TEMP"},{"qid":"CK-SPD-1","letter":"C","text":"They keep the same speed.","correct":false,"tag":"SCI-SPEED-TEMP"},{"qid":"CK-GP-1","letter":"A","text":"A phase diagram of carbon dioxide","correct":true,"tag":""},{"qid":"CK-GP-1","letter":"B","text":"A line graph of carbon dioxide particle speed vs. temperature","correct":false,"tag":"SCI-GRAPH-PURPOSE"},{"qid":"CK-GP-1","letter":"C","text":"A bar graph of the boiling points of five substances","correct":false,"tag":"SCI-GRAPH-PURPOSE"},{"qid":"CK-EV-1","letter":"A","text":"Ice in a 30°C room melted in 12 minutes; ice in a 10°C room took 40 minutes.","correct":true,"tag":""},{"qid":"CK-EV-1","letter":"B","text":"Ice is frozen water.","correct":false,"tag":"SCI-EVIDENCE"},{"qid":"CK-EV-1","letter":"C","text":"Some rooms are warmer than others.","correct":false,"tag":"SCI-EVIDENCE"},{"qid":"CK-PC-1","letter":"A","text":"They slowed down and moved closer together.","correct":true,"tag":""},{"qid":"CK-PC-1","letter":"B","text":"Each particle got smaller.","correct":false,"tag":"SCI-PARTICLES-CHANGE"},{"qid":"CK-PC-1","letter":"C","text":"Some of the particles disappeared in the cold.","correct":false,"tag":"SCI-PARTICLES-CHANGE"},{"qid":"CK-PS-1","letter":"A","text":"The particles move faster and hit the walls harder and more often.","correct":true,"tag":""},{"qid":"CK-PS-1","letter":"B","text":"The warm particles get bigger and push outward.","correct":false,"tag":"SCI-PARTICLES-CHANGE"},{"qid":"CK-PS-1","letter":"C","text":"The air gets heavier and presses down harder.","correct":false,"tag":"SCI-PRESSURE-SOURCE"},{"qid":"CK-CMP-1","letter":"A","text":"Gas particles have lots of space between them, so they can be pushed much closer together.","correct":true,"tag":""},{"qid":"CK-CMP-1","letter":"B","text":"The gas particles shrink inside the tank.","correct":false,"tag":"SCI-PARTICLES-CHANGE"},{"qid":"CK-CMP-1","letter":"C","text":"The gas particles stop moving inside the tank.","correct":false,"tag":"SCI-PARTICLES-STOP"},{"qid":"CK-PM-1","letter":"A","text":"The air particles slowed down and moved closer together.","correct":true,"tag":""},{"qid":"CK-PM-1","letter":"B","text":"The cold made the float's plastic tighter.","correct":false,"tag":"SCI-PARTICLE-MODEL"},{"qid":"CK-PM-1","letter":"C","text":"The float got tired of being stretched.","correct":false,"tag":"SCI-PARTICLE-MODEL"},{"qid":"CK-EE-1","letter":"A","text":"Thermal energy moves from your hand into the ice.","correct":true,"tag":""},{"qid":"CK-EE-1","letter":"B","text":"Cold moves from the ice into your hand.","correct":false,"tag":"SCI-ENDO-EXO"},{"qid":"CK-EE-1","letter":"C","text":"The ice's particles stop moving and pull heat in.","correct":false,"tag":"SCI-PARTICLES-STOP"},{"qid":"CK-EE-2","letter":"A","text":"It releases thermal energy into your hands.","correct":true,"tag":""},{"qid":"CK-EE-2","letter":"B","text":"It absorbs thermal energy from your hands.","correct":false,"tag":"SCI-ENDO-EXO"},{"qid":"CK-EE-2","letter":"C","text":"It pulls cold out of the air.","correct":false,"tag":"SCI-ENDO-EXO"},{"qid":"CK-PN-1","letter":"A","text":"Deposition","correct":true,"tag":""},{"qid":"CK-PN-1","letter":"B","text":"Condensation","correct":false,"tag":"SCI-PHASE-NAMES"},{"qid":"CK-PN-1","letter":"C","text":"Freezing","correct":false,"tag":"SCI-PHASE-NAMES"},{"qid":"CK-PN-1","letter":"D","text":"Sublimation","correct":false,"tag":"SCI-PHASE-NAMES"},{"qid":"CK-PN-2","letter":"A","text":"Melting","correct":true,"tag":""},{"qid":"CK-PN-2","letter":"B","text":"Boiling","correct":false,"tag":"SCI-PHASE-NAMES"},{"qid":"CK-PN-2","letter":"C","text":"Condensation","correct":false,"tag":"SCI-PHASE-NAMES"},{"qid":"CK-PN-2","letter":"D","text":"Sublimation","correct":false,"tag":"SCI-PHASE-NAMES"}],"tags":[{"id":"CAL-SCALE","kind":"Calibration","title":"Scale Drift Detected","explain":"Your instruments are reading off! Before you read a value, find out what each gridline is worth: pick two labeled numbers next to each other on the axis and find the difference. A point between gridlines is between those values, so estimate how far between.","teacherNote":"Misread the axis interval, or snapped a between-gridline point to the nearest line.","drill":"scale-read"},{"id":"CAL-AXIS","kind":"Calibration","title":"Crossed Wires","explain":"Every point has two numbers: one across the bottom (the x-axis) and one up the side (the y-axis). First find the axis whose label matches what the question asks for. Then read your answer from THAT axis.","teacherNote":"Answered with the x-value when the y-value was asked (or the reverse).","drill":"axis-read"},{"id":"CAL-AXIS-CHOICE","kind":"Calibration","title":"Which Variable Goes Where","explain":"The x-axis (along the bottom) gets the variable the scientists CHOSE or changed on purpose, like the temperatures they set or the times they checked. The y-axis (up the side) gets what they MEASURED as a result. Chose it: x-axis. Measured it: y-axis.","teacherNote":"Put the measured (dependent) variable on the x-axis. Lesson 5, Step 1.","drill":"variable-placement"},{"id":"CAL-POINT","kind":"Calibration","title":"Wrong Target","explain":"You read a real value, just not the one the question asked about. Find the question's value on its axis first, put your finger there, then move straight to the line or bar.","teacherNote":"Read a neighboring data point instead of the requested one.","drill":"point-find"},{"id":"CAL-SPACING","kind":"Calibration","title":"Uneven Ground","explain":"Data points aren't always the same distance apart. A long stretch of line isn't the same as a steep one. To compare, figure out how much the line rises for each step across: rise divided by the distance across.","teacherNote":"Judged the size of a change by how long the segment is; ignored uneven x-intervals. Also fires when plotting uneven data at even spacing.","drill":"uneven-spacing"},{"id":"CAL-TREND","kind":"Calibration","title":"Zoom Out","explain":"A trend is the overall direction of the whole line from left to right. Ignore the small wiggles. Compare the first point to the last one: the line mostly goes up, mostly goes down, stays flat, or goes up and then down.","teacherNote":"Misdescribed the overall direction, or let one segment override the whole pattern.","drill":"trend-read"},{"id":"CAL-PREDICT","kind":"Calibration","title":"Follow the Path","explain":"To predict past the end of the data, keep the line going the way it's already going, including whether it's getting steeper or flatter near the end.","teacherNote":"Extrapolated from the wrong part of the curve (e.g., used the early steep slope).","drill":"extrapolate"},{"id":"CAL-REGION","kind":"Calibration","title":"Lost the Map","explain":"On a phase diagram, find the temperature on the x-axis and the pressure on the y-axis, then slide both until they meet. The region where they meet tells you the state.","teacherNote":"Located the (T, P) point in the wrong region.","drill":"phase-region"},{"id":"CAL-TRACE","kind":"Calibration","title":"Retrace the Route","explain":"When one thing stays the same, you travel in a straight line. Same pressure: move left or right. Same temperature: move up or down. Note the region where you start, then watch for every line you cross.","teacherNote":"Traced a change in the wrong direction, or missed crossing a boundary.","drill":"phase-trace"},{"id":"CAL-LOG","kind":"Calibration","title":"The Stretchy Ruler","explain":"On a log scale, each labeled line is 10 times the one below it: 0.1, 1, 10, 100. The unlabeled lines between two labels count up by the lower label. Between 1 and 10 they mean 2, 3, 4... 9, and they get squeezed closer together near the top. Count lines instead of measuring distance.","teacherNote":"Read a log axis as if it were evenly spaced. Tested on the unit test's nitrogen diagram; not practiced in Lesson 5.","drill":"log-read"},{"id":"CAL-TABLE","kind":"Calibration","title":"Row and Column Check","explain":"Find the row for the thing you're asked about, then slide across to the right column. Check the column header twice: the cell where your row and column meet is your answer.","teacherNote":"Read the wrong row or the wrong column of a data table.","drill":"table-read"},{"id":"CAL-SERIES","kind":"Calibration","title":"Wrong Line","explain":"This graph has more than one line. Use the key to find the line for the thing the question asks about (match the shape of its markers), then read only that line.","teacherNote":"Read a value or trend from the wrong data series on a multi-line graph.","drill":"series-read"},{"id":"CAL-SCALE-CHOICE","kind":"Calibration","title":"Blueprint Check","explain":"A good scale fits ALL the data, counts by the same amount every time, and uses most of the graph so it's easy to read.","teacherNote":"Chose a scale that cuts off data, uses unequal intervals, or squashes the data (Lesson 5, Step 2).","drill":"scale-choose"},{"id":"SCI-KE-TEMP","kind":"Archive","title":"Temperature Is the Speedometer","explain":"Average kinetic energy depends on temperature. Higher temperature means faster particles and more kinetic energy. Pressure can change the state, but it isn't what measures particle energy.","teacherNote":"Hanson's named misconception: picking the highest-pressure point for greatest kinetic energy.","drill":""},{"id":"SCI-MOTION-STATES","kind":"Archive","title":"Know Your States","explain":"Solid particles vibrate in place. Liquid particles slide past one another while staying close. Gas particles move freely and spread far apart.","teacherNote":"Read the phase correctly but matched it to the wrong particle motion (Hanson's second named misconception).","drill":""},{"id":"SCI-PARTICLES-STOP","kind":"Archive","title":"Particles Never Clock Out","explain":"Particles in solids, liquids, and gases are always moving. In a solid they vibrate in place, but they never just stop, not even in ice, and not when they're squeezed.","teacherNote":"Believes frozen, cold, or high-pressure particles stop moving.","drill":""},{"id":"SCI-SPEED-TEMP","kind":"Archive","title":"Heat Speeds Things Up","explain":"Adding thermal energy makes particles move faster. As temperature rises, particle speed rises too. It doesn't hit a limit or turn around.","teacherNote":"Believes particle speed plateaus or reverses as temperature rises.","drill":""},{"id":"SCI-GRAPH-PURPOSE","kind":"Archive","title":"Right Tool for the Job","explain":"A line graph shows how one thing changes as another changes, like speed vs. temperature. A phase diagram shows which state exists at a temperature AND a pressure. Different questions need different graphs.","teacherNote":"Lesson 5's central idea: different graphs answer different questions.","drill":""},{"id":"SCI-EVIDENCE","kind":"Archive","title":"Evidence Check","explain":"Evidence has to be true AND connected to the claim. A true fact that doesn't show what the claim says isn't evidence for it.","teacherNote":"Chose true-but-irrelevant statements as evidence, or missed valid evidence. Supports CER writing.","drill":""},{"id":"SCI-PARTICLES-CHANGE","kind":"Archive","title":"Same Particles, New Moves","explain":"Heating, cooling, or squeezing doesn't change the particles themselves. They don't grow, shrink, get heavier, disappear, or break apart. What changes is how fast they move and how far apart they are.","teacherNote":"Believes particles themselves grow, shrink, gain mass, break apart, or are destroyed (unit test distractor pattern).","drill":""},{"id":"SCI-PRESSURE-SOURCE","kind":"Archive","title":"Tiny Collisions","explain":"Gas pressure comes from particles hitting the walls of their container. More hits, or harder hits, mean more pressure. Faster particles or more particles in the same space both raise the pressure.","teacherNote":"Attributes pressure to the weight of gas, suction, or air sneaking in (unit test distractor pattern).","drill":""},{"id":"SCI-COMPRESS","kind":"Archive","title":"Mind the Gap","explain":"Gas particles have lots of empty space between them, so they can be squeezed closer together. Liquid and solid particles are already close together, so they barely squeeze at all.","teacherNote":"Explains compressibility by weight or particle size instead of spacing.","drill":""},{"id":"SCI-PARTICLE-MODEL","kind":"Archive","title":"Think Particles","explain":"When a question asks what's happening with the particles, the answer has to be about the particles: their speed, their spacing, and their collisions. An explanation about the container or its material doesn't answer the question.","teacherNote":"Gave a non-particle explanation (rubber got stiff, can got weak). These are tempting because they sound plausible.","drill":""},{"id":"SCI-ENDO-EXO","kind":"Archive","title":"Follow the Energy","explain":"Cold isn't something that flows. Thermal energy always moves from warmer to cooler. A cold pack feels cold because it absorbs thermal energy from your skin. A hot pack releases thermal energy into it.","teacherNote":"Believes 'cold' is transferred, or reverses the direction of thermal energy flow.","drill":""},{"id":"SCI-PHASE-NAMES","kind":"Archive","title":"Name That Change","explain":"Melting: solid to liquid. Freezing: liquid to solid. Boiling or evaporation: liquid to gas. Condensation: gas to liquid. Sublimation: solid straight to gas. Deposition: gas straight to solid.","teacherNote":"Mixed up phase-change vocabulary or melting point vs. boiling point.","drill":""}]}</script>
